<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f7;
    --panel: #ffffff;
    --ink: #161a2b;
    --muted: #5d6580;
    --line: #d5daea;
    --accent: #3b3bf0;
    --accent-ink: #ffffff;
    --pointer: #161a2b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11131d; --panel: #1b1e2d; --ink: #f1f3fb; --muted: #9aa2c0;
      --line: #2e3350; --accent: #7a7aff; --accent-ink: #11131d; --pointer: #f1f3fb;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11131d; --panel: #1b1e2d; --ink: #f1f3fb; --muted: #9aa2c0;
    --line: #2e3350; --accent: #7a7aff; --accent-ink: #11131d; --pointer: #f1f3fb;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.5;
  }
  main {
    max-width: 1080px; margin: 0 auto; padding: 24px 16px 40px;
    display: grid; gap: 24px; grid-template-columns: 1fr;
  }
  @media (min-width: 860px) {
    main { grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr); align-items: start; padding-top: 40px; }
  }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.4rem);
    line-height: 1.1; margin: 0 0 16px; text-align: center; letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .stage { display: flex; flex-direction: column; align-items: center; }
  .wheel-wrap { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; top: -6px; left: 50%; width: 36px; height: 44px;
    transform: translateX(-50%); z-index: 2; pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.35));
  }
  .pointer.tick { animation: tick .12s ease-out; transform-origin: 50% 20%; }
  @keyframes tick { 50% { transform: translateX(-50%) rotate(-14deg); } }
  .hub {
    position: absolute; top: 50%; left: 50%; width: 22%; aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--display); font-weight: 800; font-size: clamp(.9rem, 3.4vw, 1.3rem);
    box-shadow: 0 0 0 6px var(--panel), 0 4px 14px rgba(0,0,0,.3);
  }
  .hub:disabled { cursor: progress; opacity: .85; }
  .hub:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 3px;
  }
  .result {
    margin-top: 20px; width: 100%; max-width: 520px; min-height: 92px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; text-align: center; display: flex; flex-direction: column;
    justify-content: center; gap: 8px; align-items: center;
  }
  .result .label { color: var(--muted); font-size: .9rem; }
  .result .winner { font-family: var(--display); font-weight: 800; font-size: 1.7rem; line-height: 1.15; overflow-wrap: anywhere; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    display: grid; gap: 18px;
  }
  .field { display: grid; gap: 6px; }
  .field > label, .field > .lbl { font-weight: 600; font-size: .95rem; }
  .hint { color: var(--muted); font-size: .85rem; font-weight: 400; }
  input[type="text"], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 200px; resize: vertical; line-height: 1.45; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    display: flex; height: 34px; width: 92px; border-radius: 8px; overflow: hidden;
    border: 2px solid transparent; padding: 0; cursor: pointer; background: none;
    outline: 1px solid var(--line);
  }
  .swatch span { flex: 1; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); outline-color: transparent; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .check { display: flex; gap: 10px; align-items: center; font-size: .95rem; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button.btn {
    font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .history { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .history li {
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 11px; font-size: .85rem; overflow-wrap: anywhere;
  }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .save-row { display: flex; gap: 8px; }
  .save-row input { flex: 1; min-width: 0; }
  .saved { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .saved li {
    display: flex; align-items: center; gap: 8px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px;
  }
  .saved .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .saved .count { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .saved button { padding: 5px 10px; font-size: .9rem; }
  .status { color: var(--muted); font-size: .8rem; }
  /* ---- OBS / overlay mode: add ?overlay=1 to the URL ---- */
  html.overlay, html.overlay body { background: transparent !important; overflow: hidden; }
  html.overlay { --reserve: 170px; padding: 0; }
  html.overlay.no-result { --reserve: 80px; }
  html.overlay.no-title { --reserve: 100px; }
  html.overlay.no-title.no-result { --reserve: 16px; }
  html.overlay main { display: block; max-width: none; padding: 8px; }
  html.overlay .panel, html.overlay .no-ov { display: none !important; }
  html.overlay h1 { color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.7); margin-bottom: 8px; }
  html.overlay.no-title h1 { display: none; }
  html.overlay.no-result .result { display: none; }
  html.overlay.no-hub .hub { display: none; }
  html.overlay .wheel-wrap { max-width: none; width: min(100%, calc(100vh - var(--reserve))); }
  html.overlay canvas { cursor: pointer; }
  html.overlay .result { background: rgba(17,19,29,.88); border-color: transparent; color: #fff; min-height: 70px; }
  html.overlay .result .label { color: #c5cbe6; }
  @media (prefers-reduced-motion: reduce) { .pointer.tick { animation: none; } }
</style>
</head>
<body>
<main>
  <section class="stage" aria-label="Wheel">
    <h1 id="titleOut">Spin the wheel</h1>
    <div class="wheel-wrap" id="wrap">
      <canvas id="wheel" role="img" aria-label="Spin wheel"></canvas>
      <svg class="pointer" id="pointer" viewBox="0 0 36 44" aria-hidden="true">
        <path d="M18 44 L2 12 A18 18 0 1 1 34 12 Z" fill="var(--pointer)"/>
        <circle cx="18" cy="14" r="5" fill="var(--panel)"/>
      </svg>
      <button class="hub" id="spinBtn" type="button">Spin</button>
    </div>
    <div class="result" id="result" aria-live="polite">
      <div class="label">Press Spin to pick one.</div>
    </div>
  </section>

  <section class="panel" aria-label="Customize">
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" maxlength="60">
    </div>

    <div class="field">
      <label for="options">Options <span class="hint">One per line</span></label>
      <textarea id="options" spellcheck="false"></textarea>
      <div class="btns">
        <button class="btn" type="button" id="shuffle">Shuffle order</button>
        <button class="btn" type="button" id="sample">Load example</button>
        <button class="btn" type="button" id="clear">Clear</button>
      </div>
    </div>

    <div class="field">
      <span class="lbl">Presets</span>
      <div class="presets" id="presets"></div>
    </div>

    <div class="field">
      <label for="listName">Saved lists</label>
      <div class="save-row">
        <input type="text" id="listName" maxlength="40" placeholder="Name this list">
        <button class="btn primary" type="button" id="saveList">Save</button>
      </div>
      <ul class="saved" id="saved"></ul>
      <span class="status" id="saveStatus"></span>
    </div>

    <div class="field">
      <span class="lbl">Colors</span>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="field">
      <div class="row"><label for="dur">Spin time</label><span class="hint" id="durOut">5s</span></div>
      <input type="range" id="dur" min="2" max="12" step="1" value="5">
    </div>

    <label class="check"><input type="checkbox" id="removeWinner"> Remove each winner after it is picked</label>
    <label class="check"><input type="checkbox" id="sound" checked> Tick sound</label>

    <div class="field" id="histBox" hidden>
      <div class="row"><span class="lbl">Past results</span>
        <button class="btn" type="button" id="clearHist">Clear</button></div>
      <ul class="history" id="history"></ul>
    </div>
  </section>
</main>

<script>
(function () {
  var PALETTES = {
    Bright: ["#ff5a5f", "#ffb400", "#2ec4b6", "#3b3bf0", "#ff7eb6", "#7bd389"],
    Sunset: ["#f94144", "#f3722c", "#f8961e", "#f9c74f", "#90be6d", "#577590"],
    Ocean:  ["#03045e", "#0077b6", "#00b4d8", "#48cae4", "#90e0ef", "#023e8a"],
    Candy:  ["#ffadad", "#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff", "#bdb2ff"],
    Mono:   ["#1f2430", "#4a5268", "#7a839c", "#a9b0c4", "#d3d7e3"]
  };
  // Edit these three presets: change the title and the options (one string per option).
  var PRESETS = [
    { name: "$13 Spins", title: "$13 Spins",
      options: ["Custom Aftershow Pics", "Titty Tease", "Spanks", "Topless Flash", "Ass Worship", "Dance Party", "Hitachi Tease"] },
    { name: "$28 Wheel Spins", title: "$28 Wheel Spins",
      options: ["Tit Worship", "Blowjob Tease", "Nipple Clamps", "Mini Shot", "Anal Tease", "Pussy Tease", "Titty Fuck Tease"] }
  ];
  var SAMPLE = PRESETS[0].options;
  var DEFAULTS = { title: PRESETS[0].title, options: SAMPLE.join("\n"),
    palette: "Bright", dur: 5, removeWinner: false, sound: true, history: [] };

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("wheel"), ctx = canvas.getContext("2d");
  var state = load();
  var params = new URLSearchParams(location.search);
  var OVERLAY = params.get("overlay") === "1";
  if (OVERLAY) {
    var root = document.documentElement;
    root.classList.add("overlay");
    if (params.get("title") === "0") root.classList.add("no-title");
    if (params.get("result") === "0") root.classList.add("no-result");
    if (params.get("hub") === "0") root.classList.add("no-hub");
    var pi = parseInt(params.get("preset"), 10);
    if (pi >= 1 && pi <= PRESETS.length) { state.title = PRESETS[pi - 1].title; state.options = PRESETS[pi - 1].options.join("\n"); }
    var secs = parseInt(params.get("seconds"), 10);
    if (secs >= 2 && secs <= 12) state.dur = secs;
    state.removeWinner = params.get("remove") === "1";
    state.sound = params.get("sound") !== "0";
    state.history = [];
  }
  var rotation = 0, spinning = false, lastTickIdx = -1, audio = null;

  function load() {
    var s = {};
    try { s = JSON.parse(localStorage.getItem("spinwheel-v1") || "{}") || {}; } catch (e) {}
    var out = {};
    for (var k in DEFAULTS) out[k] = (s[k] !== undefined) ? s[k] : DEFAULTS[k];
    if (!PALETTES[out.palette]) out.palette = "Bright";
    if (!Array.isArray(out.history)) out.history = [];
    return out;
  }
  function save() {
    if (OVERLAY) return;
    try { localStorage.setItem("spinwheel-v1", JSON.stringify(state)); } catch (e) {}
  }
  function items() {
    return state.options.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function colorFor(i, n) {
    var p = PALETTES[state.palette];
    var c = p[i % p.length];
    // avoid same color touching at the wrap-around
    if (n > 1 && i === n - 1 && i % p.length === 0) c = p[(p.length > 1 ? 1 : 0)];
    return c;
  }
  function textOn(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#161a2b" : "#ffffff";
  }

  function resize() {
    var size = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    draw();
  }

  function draw() {
    var size = canvas.width, cx = size / 2, R = size / 2 - size * 0.015;
    var list = items(), n = list.length;
    ctx.clearRect(0, 0, size, size);

    // rim
    ctx.beginPath(); ctx.arc(cx, cx, R + size * 0.012, 0, Math.PI * 2);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#161a2b";
    ctx.fill();

    if (n === 0) {
      ctx.beginPath(); ctx.arc(cx, cx, R, 0, Math.PI * 2);
      ctx.fillStyle = "#c9cfe0"; ctx.fill();
      ctx.fillStyle = "#161a2b"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "700 " + size * 0.045 + "px Figtree, sans-serif";
      ctx.fillText("Add some options", cx, cx + size * 0.2);
      return;
    }

    var seg = Math.PI * 2 / n;
    for (var i = 0; i < n; i++) {
      var a0 = rotation + i * seg, a1 = a0 + seg, col = colorFor(i, n);
      ctx.beginPath(); ctx.moveTo(cx, cx); ctx.arc(cx, cx, R, a0, a1); ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
      if (n > 1) { ctx.lineWidth = size * 0.004; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.stroke(); }

      // label
      ctx.save();
      ctx.translate(cx, cx); ctx.rotate(a0 + seg / 2);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillStyle = textOn(col);
      var maxW = R * 0.66, fs = Math.min(size * 0.055, (seg * R * 0.5));
      var label = list[i];
      ctx.font = "700 " + fs + "px Figtree, system-ui, sans-serif";
      while (ctx.measureText(label).width > maxW && fs > size * 0.022) {
        fs *= 0.92; ctx.font = "700 " + fs + "px Figtree, system-ui, sans-serif";
      }
      while (ctx.measureText(label).width > maxW && label.length > 2) label = label.slice(0, -2) + "…";
      ctx.fillText(label, R - size * 0.04, 0);
      ctx.restore();
    }
  }

  function currentIndex() {
    var n = items().length; if (!n) return -1;
    var seg = Math.PI * 2 / n, TAU = Math.PI * 2;
    var a = ((-Math.PI / 2 - rotation) % TAU + TAU) % TAU;
    return Math.floor(a / seg) % n;
  }

  function tick() {
    var p = $("pointer");
    p.classList.remove("tick"); void p.offsetWidth; p.classList.add("tick");
    if (!state.sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = "triangle"; o.frequency.value = 520;
      g.gain.setValueAtTime(0.08, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.06);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.07);
    } catch (e) {}
  }

  function spin() {
    var list = items(), n = list.length;
    if (spinning || n === 0) return;
    spinning = true; $("spinBtn").disabled = true;
    var TAU = Math.PI * 2, seg = TAU / n;
    var winner = Math.floor(Math.random() * n);
    var jitter = 0.1 + Math.random() * 0.8; // stay off the segment edges
    var target = -Math.PI / 2 - (winner + jitter) * seg;
    var delta = (((target - rotation) % TAU) + TAU) % TAU;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dur = (reduce ? 1.5 : state.dur) * 1000;
    var spins = reduce ? 1 : 4 + Math.floor(state.dur / 2);
    var total = delta + spins * TAU, start = rotation, t0 = performance.now();
    lastTickIdx = currentIndex();
    $("result").innerHTML = '<div class="label">Spinning…</div>';

    function frame(now) {
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - t, 4);
      rotation = start + total * e;
      var idx = currentIndex();
      if (idx !== lastTickIdx) { lastTickIdx = idx; tick(); }
      draw();
      if (t < 1) requestAnimationFrame(frame); else finish(list[winner], winner);
    }
    requestAnimationFrame(frame);
  }

  function finish(name, idx) {
    spinning = false; $("spinBtn").disabled = false;
    state.history.unshift(name); state.history = state.history.slice(0, 20);
    var box = $("result");
    box.innerHTML = '<div class="label">Winner</div><div class="winner"></div>';
    box.querySelector(".winner").textContent = name;
    if (state.removeWinner) {
      var arr = state.options.split("\n"), count = -1;
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].trim()) { count++; if (count === idx) { arr.splice(i, 1); break; } }
      }
      state.options = arr.join("\n");
      $("options").value = state.options;
      var left = items().length;
      var note = document.createElement("div");
      note.className = "label";
      note.textContent = left ? "Removed from the wheel. " + left + " left." : "That was the last option.";
      box.appendChild(note);
      draw();
    }
    save(); renderHistory();
  }

  function renderHistory() {
    var ul = $("history"); ul.innerHTML = "";
    state.history.forEach(function (h) {
      var li = document.createElement("li"); li.textContent = h; ul.appendChild(li);
    });
    $("histBox").hidden = state.history.length === 0;
  }

  function renderSwatches() {
    var box = $("swatches"); box.innerHTML = "";
    Object.keys(PALETTES).forEach(function (name) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "swatch"; b.title = name;
      b.setAttribute("aria-label", name + " colors");
      b.setAttribute("aria-pressed", String(name === state.palette));
      PALETTES[name].forEach(function (c) {
        var s = document.createElement("span"); s.style.background = c; b.appendChild(s);
      });
      b.addEventListener("click", function () { state.palette = name; save(); renderSwatches(); draw(); });
      box.appendChild(b);
    });
  }

  function syncTitle() { $("titleOut").textContent = state.title.trim() || "Spin the wheel"; }

  // wiring
  $("title").value = state.title;
  $("options").value = state.options;
  $("dur").value = state.dur; $("durOut").textContent = state.dur + "s";
  $("removeWinner").checked = !!state.removeWinner;
  $("sound").checked = !!state.sound;
  syncTitle(); renderSwatches(); renderHistory();

  $("title").addEventListener("input", function (e) { state.title = e.target.value; syncTitle(); save(); });
  $("options").addEventListener("input", function (e) { if (spinning) return; state.options = e.target.value; save(); draw(); });
  $("dur").addEventListener("input", function (e) { state.dur = +e.target.value; $("durOut").textContent = state.dur + "s"; save(); });
  $("removeWinner").addEventListener("change", function (e) { state.removeWinner = e.target.checked; save(); });
  $("sound").addEventListener("change", function (e) { state.sound = e.target.checked; save(); });
  $("spinBtn").addEventListener("click", spin);
  $("shuffle").addEventListener("click", function () {
    if (spinning) return;
    var a = items();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    state.options = a.join("\n"); $("options").value = state.options; save(); draw();
  });
  $("sample").addEventListener("click", function () {
    if (spinning) return;
    state.options = SAMPLE.join("\n"); $("options").value = state.options; save(); draw();
  });
  $("clear").addEventListener("click", function () {
    if (spinning) return;
    state.options = ""; $("options").value = ""; save(); draw();
    $("result").innerHTML = '<div class="label">Add options on the right, then press Spin.</div>';
  });
  $("clearHist").addEventListener("click", function () { state.history = []; save(); renderHistory(); });

  // ---- built-in presets ----
  (function renderPresets() {
    var box = $("presets");
    PRESETS.forEach(function (p) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn"; b.textContent = p.name;
      b.addEventListener("click", function () {
        if (spinning) return;
        state.title = p.title; state.options = p.options.join("\n");
        $("title").value = state.title; $("options").value = state.options;
        syncTitle(); save(); draw();
        $("result").innerHTML = '<div class="label">Loaded “' + p.name.replace(/[<>&]/g, "") + '”. Press Spin.</div>';
      });
      box.appendChild(b);
    });
  })();

  // ---- saved lists (synced to the viewer's Claude account when available, else this browser) ----
  var lists = [], dbDoc = null;
  try { lists = JSON.parse(localStorage.getItem("spinwheel-lists-v1") || "[]") || []; } catch (e) { lists = []; }
  if (!Array.isArray(lists)) lists = [];

  function persistLists() {
    try { localStorage.setItem("spinwheel-lists-v1", JSON.stringify(lists)); } catch (e) {}
    if (dbDoc) dbDoc.set({ lists: lists }).catch(function () {
      $("saveStatus").textContent = "Could not sync. Saved in this browser only.";
    });
  }
  function countOf(txt) { return String(txt).split("\n").filter(function (x) { return x.trim(); }).length; }
  function renderLists() {
    var ul = $("saved"); ul.innerHTML = "";
    lists.forEach(function (l, i) {
      var li = document.createElement("li");
      var nm = document.createElement("span"); nm.className = "name"; nm.textContent = l.name;
      var ct = document.createElement("span"); ct.className = "count"; ct.textContent = countOf(l.options) + " items";
      var load = document.createElement("button"); load.type = "button"; load.className = "btn"; load.textContent = "Load";
      load.addEventListener("click", function () {
        if (spinning) return;
        state.options = l.options; state.title = l.title || state.title;
        $("options").value = state.options; $("title").value = state.title;
        syncTitle(); save(); draw();
      });
      var del = document.createElement("button"); del.type = "button"; del.className = "btn"; del.textContent = "Delete";
      del.setAttribute("aria-label", "Delete " + l.name);
      del.addEventListener("click", function () { lists.splice(i, 1); persistLists(); renderLists(); });
      li.appendChild(nm); li.appendChild(ct); li.appendChild(load); li.appendChild(del);
      ul.appendChild(li);
    });
  }
  $("saveList").addEventListener("click", function () {
    var name = $("listName").value.trim() || state.title.trim() || "Untitled list";
    if (!items().length) { $("saveStatus").textContent = "Add some options before saving."; return; }
    var entry = { name: name, title: state.title, options: state.options };
    var at = -1;
    lists.forEach(function (l, i) { if (l.name.toLowerCase() === name.toLowerCase()) at = i; });
    if (at >= 0) lists[at] = entry; else lists.unshift(entry);
    lists = lists.slice(0, 50);
    persistLists(); renderLists();
    $("listName").value = "";
    $("saveStatus").textContent = (at >= 0 ? "Updated “" : "Saved “") + name + "”.";
  });
  $("listName").addEventListener("keydown", function (e) { if (e.key === "Enter") $("saveList").click(); });
  renderLists();
  $("saveStatus").textContent = "Saved in this browser.";

  (async function connectSync() {
    try {
      if (OVERLAY || !window.claude || !window.claude.use) return;
      var db = await window.claude.use("db");
      var user = await window.claude.use("user");
      if (!db || !user) return;
      var id = await user.id();
      if (!id) return;
      var doc = db.doc("data/users/" + id + "/wheel-lists");
      var snap = await doc.get();
      if (snap.exists) {
        var remote = (snap.data() || {}).lists;
        if (Array.isArray(remote)) {
          // merge: account copy wins on name clashes; keep local-only lists
          var names = {};
          remote.forEach(function (l) { names[String(l.name).toLowerCase()] = true; });
          lists = remote.concat(lists.filter(function (l) { return !names[String(l.name).toLowerCase()]; })).slice(0, 50);
        }
      }
      dbDoc = doc;
      persistLists(); renderLists();
      $("saveStatus").textContent = "Synced to your Claude account.";
    } catch (e) { /* stay on browser storage */ }
  })();

  if (OVERLAY) {
    canvas.addEventListener("click", spin);
    window.addEventListener("keydown", function (e) {
      if (e.code === "Space") { e.preventDefault(); spin(); }
    });
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe($("wrap")); else window.addEventListener("resize", resize);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  resize();
})();
</script>
</body>
</html>
